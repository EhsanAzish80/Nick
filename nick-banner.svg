<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="160" rx="12" fill="url(#bg)"/>
  
  <!-- Shield icon -->
  <g transform="translate(180, 35)">
    <path d="M24 4 L44 12 L44 28 C44 42 36 52 24 56 C12 52 4 42 4 28 L4 12 Z" 
          fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M16 28 L22 34 L34 22" 
          fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Nick text -->
  <text x="240" y="72" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" 
        font-size="48" font-weight="700" fill="#e6edf3" letter-spacing="-1">Nick</text>
  
  <!-- Tagline -->
  <text x="204" y="105" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" 
        font-size="14" fill="#8b949e" letter-spacing="0.5">Open-source macOS security</text>

  <!-- Subtle bottom accent line -->
  <rect x="200" y="120" width="200" height="1.5" rx="1" fill="url(#accent)" opacity="0.4"/>
</svg>
