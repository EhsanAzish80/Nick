name: Nick

# ⚠️  IMPORTANT — READ BEFORE RUNNING xcodegen generate
#
# xcodegen does NOT support Xcode's filesystem-synced folder references
# (PBXFileSystemSynchronizedRootGroup). Every regeneration converts all
# folder references back to plain groups.
#
# Only run `xcodegen generate` when:
#   - Adding or removing a build TARGET (not individual source files)
#   - Changing build settings or schemes
#
# After any regeneration, reopen Nick.xcodeproj in Xcode and
# right-click each top-level source group → "Convert to Folder" to restore
# folder references.
#
# For day-to-day source files: create them on disk (or via File → New in
# Xcode). Filesystem-synced folders pick up new files automatically.

options:
  bundleIdPrefix: com.ehsanazish
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Set your Team ID here

targets:

  # ── Main app ──────────────────────────────────────────────────────────────
  Nick:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Nick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanazish.nick
        INFOPLIST_FILE: Nick/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NickHelper
        embed: false

  # ── Privileged helper ─────────────────────────────────────────────────────
  NickHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NickHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanazish.nick.helper
        INFOPLIST_FILE: NickHelper/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: "YES"

  # ── Unit tests ────────────────────────────────────────────────────────────
  NickTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NickTests
    dependencies:
      - target: Nick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanazish.nick.tests

  # ── Integration tests ─────────────────────────────────────────────────────
  NickIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NickIntegrationTests
    dependencies:
      - target: Nick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanazish.nick.integration-tests
